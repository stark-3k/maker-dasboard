name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions match
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Ignore pre-release suffixes: v0.2.1-rc1 / v0.2.1-demo match 0.2.1
          BASE_VERSION="${TAG_VERSION%%-*}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$BASE_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag v${TAG_VERSION} (base ${BASE_VERSION}) does not match Cargo.toml version ${CARGO_VERSION}" >&2
            echo "Bump Cargo.toml before tagging." >&2
            exit 1
          fi

  build-macos:
    name: macOS arm64 (.dmg)
    needs: check-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # libtor-src builds libevent + tor from source via autotools.
      - name: Install native build tools
        run: brew install automake autoconf libtool pkg-config openssl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-arm64-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-arm64-cargo-release-

      - name: Build .dmg
        run: make dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: target/maker-dashboard-*-macos-*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }} (.tar.gz)
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      # libtor-src builds libevent + tor from source via autotools.
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git autoconf automake libtool pkg-config \
            libssl-dev build-essential cmake file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-${{ matrix.arch }}-cargo-release-

      - name: Build
        run: make build

      # Tarball layout matches the binary's default relative frontend path
      # (frontend/build/client), so `./maker-dashboard` works as-is from the
      # extracted directory.
      - name: Assemble tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STAGE="maker-dashboard-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${STAGE}/frontend/build"
          cp target/release/maker-dashboard "dist/${STAGE}/"
          cp -r frontend/build/client "dist/${STAGE}/frontend/build/client"
          tar -czf "${STAGE}.tar.gz" -C dist "${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-tar
          path: maker-dashboard-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | -------- | ---- |
            | macOS (Apple Silicon) | `maker-dashboard-*-macos-arm64.dmg` |
            | Linux x86_64 | `maker-dashboard-*-linux-x86_64.tar.gz` |
            | Linux arm64 | `maker-dashboard-*-linux-aarch64.tar.gz` |

            **macOS:** the app is unsigned — on first launch, right-click the app and choose **Open**.

            **Linux:** extract and run `./maker-dashboard` from the extracted directory, then open <http://127.0.0.1:3000>.

            Verify downloads against `SHA256SUMS.txt`.
